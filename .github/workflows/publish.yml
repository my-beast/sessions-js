# A tag v<version> stages that version on npm through npm's trusted publishing: no token is stored here. It goes live
# once a maintainer approves it with two-factor: the package's Staged Packages tab on npmjs.com, or
# `npm stage approve <id>`. The first version was published by hand (README, "Releasing"); then the package's settings
# on npmjs.com named this repository and this workflow as its trusted publisher, allowed to stage only.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm install --global npm@latest
      # A version npm has already (0.1.0, published by hand before its tag) is left as it is.
      - name: Publish
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "npm has this version already."
          else
            npm stage publish --access public
          fi
